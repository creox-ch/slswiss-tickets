name: Безопасность

# Два гейта, которых у репо не было: известные уязвимости в зависимостях
# и секреты, случайно попавшие в код или в историю.
#
# Отдельно от Tests намеренно: у них разный смысл красного. Tests краснеют
# от нашей ошибки в коде, этот workflow — ещё и просто от времени (вчера
# зависимость была чистой, сегодня в ней CVE). Поэтому здесь есть расписание.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  # Без фильтра по базовой ветке — см. пояснение в test.yml: PR поверх другой
  # ветки иначе остаётся без проверок. И без paths-ignore: обе проверки
  # обязательны для мержа, пропуск по фильтру вешает .md-PR в «Expected».
  pull_request:
  schedule:
    # Понедельник, 06:00 UTC — чтобы новая CVE всплывала в начале недели,
    # а не в день релиза.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Зависимости (npm audit)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # история нужна, чтобы сравнить правку с базой
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Гейт: high/critical роняют сборку, КРОМЕ явно принятого
      # в .audit-allowlist.json (с причиной и сроком пересмотра).
      # Голый `npm audit --audit-level=high` здесь не годится: в репо есть
      # известная неустранимая уязвимость (Next 14), и гейт горел бы всегда.
      # Правка одних .md зависимостей не трогает — гейт по уязвимостям для неё
      # бессмысленен. Job при этом запускается всегда: он обязателен для мержа,
      # а пропущенный прогон вешает PR в «Expected» навсегда.
      # gitleaks (job ниже) НЕ пропускаем ни при каких правках: ключ можно
      # случайно вписать и в markdown, а репозиторий публичный.
      - name: Только документация?
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"; head="${{ github.sha }}"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          if [ -z "$changed" ] || echo "$changed" | grep -qv "[.]md$"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Гейт по уязвимостям (npm audit + allowlist)
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run audit:gate

      # Полный вывод для человека — включая moderate/low, которые гейт не ловит.
      - name: Полный отчёт npm audit (без гейта)
        if: always() && steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        run: npm audit

  secrets:
    name: Секреты (gitleaks)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Вся история: ключ, удалённый следующим коммитом, из репо никуда
          # не делся — public-репо, его видно всем.
          fetch-depth: 0

      # Ставим бинарник из релиза, а не gitleaks-action: сам gitleaks под MIT,
      # а его официальный action для организаций требует лицензионный ключ.
      # Версия запинена — чтобы CI не менял поведение сам по себе.
      - name: Установить gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Поиск секретов в коде и истории
        # --redact: найденный секрет НЕ печатается в лог (логи Actions в public-репо
        # читает кто угодно — иначе отчёт сам стал бы утечкой).
        run: ./gitleaks git . --no-banner --redact --verbose
