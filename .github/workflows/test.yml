name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  # Намеренно БЕЗ фильтра по базовой ветке: PR, стоящий на другой ветке
  # (стековые PR — «второй поверх первого»), иначе не проверяется вовсе.
  # Наступили на это 2026-08-17: апгрейд Next стоял на ветке предыдущего PR
  # и молча остался без единого прогона.
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (строго по package-lock.json)
        run: npm ci

      - name: Build (ловит синтакс-ошибки всех роутов без env)
        run: npm run build

      # Браузер кладём в кэш: скачивание — единственный шаг здесь, который
      # ходит наружу, и 19.08 он дважды подвесил джоб до лимита в 20 минут
      # (осиротевшим процессом в логе остался playwright install). Кэш
      # убирает причину на всех последующих прогонах.
      - name: Кэш браузера Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Библиотеки и сам браузер — разными шагами: apt и скачивание это
      # разные источники зависаний, и в общем шаге непонятно, что встало.
      # timeout-minutes, чтобы шаг падал быстро и внятно, а не съедал лимит
      # всего джоба: тогда это выглядит как «зависли тесты», хотя тесты
      # даже не начинались.
      - name: Системные библиотеки для браузера
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: npx playwright install-deps chromium

      - name: Установка браузера
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: npx playwright install chromium

      - name: Run tests (unit + e2e)
        timeout-minutes: 12
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
