name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  # Намеренно БЕЗ фильтра по базовой ветке: PR, стоящий на другой ветке
  # (стековые PR — «второй поверх первого»), иначе не проверяется вовсе.
  # Наступили на это 2026-08-17: апгрейд Next стоял на ветке предыдущего PR
  # и молча остался без единого прогона.
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (строго по package-lock.json)
        run: npm ci

      - name: Build (ловит синтакс-ошибки всех роутов без env)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests (unit + e2e)
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
